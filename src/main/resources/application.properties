# Nombre de la aplicación
spring.application.name=technical-test-3dlinkweb

# Configuración básica de la base de datos H2 (en memoria)
spring.datasource.url=jdbc:h2:mem:petclinic
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# Carga de datos iniciales (H2)
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/h2/data.sql

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
